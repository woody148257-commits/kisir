<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kısır</title>
<style>
:root{--bg:#000;--line:#262626;--mut:#8e8e8e;--acc:#0095f6;--bub:#262626;--txt:#f5f5f5;--field:#121212;--hov:#1c1c1c;--panel:#0a0a0a}
.light{--bg:#fff;--line:#dbdbdb;--mut:#737373;--bub:#efefef;--txt:#111;--field:#f2f2f2;--hov:#f0f0f0;--panel:#fafafa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.hide{display:none!important}
#app{display:grid;grid-template-columns:300px 1fr;height:100dvh}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.pad{padding:14px;border-bottom:1px solid var(--line)}
.inp{width:100%;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:10px 14px;outline:none;font-size:14px}
.btn{background:var(--acc);border-radius:10px;padding:9px 14px;font-weight:600;color:#fff}
.btn2{background:var(--bub);border-radius:10px;padding:9px 14px;font-weight:600}
.ib{width:38px;height:38px;border-radius:50%;font-size:18px;display:grid;place-items:center;flex-shrink:0}
.ib:hover,.chat:hover,.btn2:hover{background:var(--hov)}
.up{cursor:pointer}
.chats{flex:1;overflow:auto;padding:6px}
.chat{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer}
.chat.on{background:var(--hov)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex-shrink:0;color:#fff}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
main{display:flex;flex-direction:column;min-height:0;position:relative}
.empty{margin:auto;color:var(--mut);text-align:center;padding:20px}
#chatView{display:flex;flex-direction:column;flex:1;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#player{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#pTitle{flex:1;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:72%;display:flex;flex-direction:column;align-self:flex-start}
.m.me{align-self:flex-end;align-items:flex-end}
.bub{background:var(--bub);border-radius:20px;padding:8px 13px;word-break:break-word}
.m.me .bub{background:var(--acc);color:#fff}
.bub img,.bub video{max-width:280px;max-height:320px;border-radius:12px;display:block}
.bub audio{max-width:240px;height:36px}
.bub a{color:inherit}
.tm{font-size:10px;color:var(--mut);margin:2px 6px}
.typing{padding:0 16px 6px;font-size:12px;color:var(--mut);min-height:18px}
footer{display:flex;align-items:center;gap:6px;padding:10px;border-top:1px solid var(--line)}
footer .inp{flex:1}
#screen{position:absolute;top:64px;right:14px;width:min(520px,60%);background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px #000;z-index:5}
#screen video{width:100%;display:block}
#screen .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:12px;background:#111;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:20}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(360px,92vw);display:flex;flex-direction:column;gap:12px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:50;background:var(--bub);padding:10px 16px;border-radius:12px;max-width:90vw;text-align:center}
@media(max-width:760px){
  #app{grid-template-columns:1fr}
  #app.open aside{display:none}
  #app:not(.open) main{display:none}
  #app:not(.open) aside{display:flex}
  #screen{width:94%;right:3%}
}
</style>
</head>
<body>

<div id="login" class="modal hide">
  <div class="box" style="text-align:center">
    <div style="font-size:22px;font-weight:800;letter-spacing:4px">KISIR</div>
    <input id="nick" class="inp" placeholder="Görünen adınız" maxlength="20">
    <button class="btn" id="go">Başla</button>
  </div>
</div>

<div id="app" class="hide">
  <aside>
    <div class="pad" style="display:flex;gap:10px;align-items:center">
      <div class="av" id="meAv"></div>
      <div style="flex:1;min-width:0">
        <div id="meName" class="ell" style="font-weight:700"></div>
        <div id="meId" class="ell" style="font-size:11px;color:var(--mut);cursor:pointer" title="Kopyala"></div>
      </div>
      <button class="ib" id="bSet" title="Tema">🎨</button>
    </div>
    <div class="pad" style="display:flex;gap:6px">
      <input id="addId" class="inp" placeholder="Arkadaşının ID'si" autocomplete="off">
      <button class="btn" id="bAdd">Ekle</button>
    </div>
    <div class="chats" id="chats"></div>
  </aside>

  <main>
    <div class="empty" id="empty">Soldan bir sohbet seçin ya da arkadaşınızın ID'si ile yeni sohbet başlatın.</div>
    <div id="chatView" class="hide">
      <header>
        <button class="ib" id="bBack">←</button>
        <div class="av" id="pAv" style="width:36px;height:36px;font-size:14px"></div>
        <div id="pName" class="ell" style="flex:1;font-weight:700"></div>
        <button class="ib" id="bMusic" title="Birlikte dinle">🎵</button>
        <button class="ib" id="bShare" title="Ekran paylaş">🖥️</button>
      </header>
      <div id="player" class="hide">
        <span id="pTitle">Parça yok</span>
        <button class="btn2" id="pPlay">▶</button>
        <label class="btn2 up">📁<input type="file" id="pFile" accept="audio/*" hidden></label>
      </div>
      <div id="msgs"></div>
      <div class="typing" id="typing"></div>
      <footer>
        <label class="ib up" title="Fotoğraf, video veya dosya">📎<input type="file" id="file" hidden></label>
        <button class="ib" id="bRec" title="Sesli mesaj">🎤</button>
        <input id="txt" class="inp" placeholder="Mesaj yaz…" autocomplete="off">
        <button class="btn" id="bSend">Gönder</button>
      </footer>
    </div>
  </main>
</div>

<div id="screen" class="hide">
  <div class="bar"><span id="scTxt"></span><button id="scClose">✕</button></div>
  <video id="scVid" autoplay playsinline controls></video>
</div>

<div id="setModal" class="modal hide">
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>Tema</b><button class="ib" id="setX">✕</button></div>
    <div id="swatches" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <label><input type="checkbox" id="lightT"> Açık tema</label>
  </div>
</div>

<div id="toast" class="hide"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,orderBy,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

const app=initializeApp({
  apiKey:"AIzaSyDxe_5d7y1R4aW30uIYu2QQoifJ7aS6uO8",
  authDomain:"yerlivemillichat.firebaseapp.com",
  projectId:"yerlivemillichat",
  storageBucket:"yerlivemillichat.firebasestorage.app",
  messagingSenderId:"225196502397",
  appId:"1:225196502397:web:ac2741bd9b54595a6ff014"
});
const db=getFirestore(app), storage=getStorage(app);

// ---------- Yardımcılar ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS=["#0095f6","#8e5cf5","#10b981","#f43f5e","#f59e0b","#ec4899"];
const colorOf=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const newId=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const RTC={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("hide");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add("hide"),2500);}
const fail=prefix=>err=>{console.error(err);toast(prefix+": "+(err?.message||err));};

// Fotoğrafı küçült (GIF'e dokunma). Hata olursa orijinali döndür.
async function shrink(f){
  if(!f.type.startsWith("image/")||f.type==="image/gif") return f;
  try{
    const bmp=await createImageBitmap(f);
    const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");
    c.width=Math.round(bmp.width*s); c.height=Math.round(bmp.height*s);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    bmp.close?.();
    return await new Promise(r=>c.toBlob(b=>r(b||f),"image/jpeg",0.8));
  }catch{ return f; }
}

// ---------- Durum ----------
let me=null, uid=null, started=false;
let cur=null, otherId=null;
let chatList=[], users={};
const unsubs={chats:null,msgs:null,music:null,chat:null,calls:null};
const shown=new Set();
let mState=null, typ={}, typingAt=0, share=null, viewer=null;
const au=new Audio();

// ---------- Giriş (hesap yok, ID ile) ----------
const saved=JSON.parse(localStorage.getItem("kisir_me")||"null");
if(saved){
  me=saved; uid=saved.id;
  setDoc(doc(db,"users",uid),{name:me.name},{merge:true}).catch(()=>{});
  start();
} else $("login").classList.remove("hide");

async function doLogin(){
  const n=$("nick").value.trim(); if(!n) return toast("Bir ad yazın");
  me={id:newId(),name:n}; uid=me.id;
  try{
    await setDoc(doc(db,"users",uid),{name:n});
    localStorage.setItem("kisir_me",JSON.stringify(me));
    $("login").classList.add("hide"); start();
  }catch(err){ fail("Giriş")(err); }
}
$("go").onclick=doLogin;
$("nick").onkeydown=e=>{if(e.key==="Enter") doLogin();};

function start(){
  if(started) return; started=true;
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  $("meAv").textContent=me.name[0].toUpperCase(); $("meAv").style.background=colorOf(uid);
  $("meName").textContent=me.name; $("meId").textContent="ID: "+uid;
  listChats(); applyTheme();
}
$("meId").onclick=()=>{navigator.clipboard?.writeText(uid);toast("ID kopyalandı");};
window.addEventListener("beforeunload",()=>{ if(share) stopShare(); });

async function profile(id){
  if(!users[id]){
    const s=await getDoc(doc(db,"users",id));
    users[id]=s.exists()?s.data():{name:"Bilinmeyen"};
  }
  return users[id];
}

// ---------- Sohbet listesi ----------
function listChats(){
  unsubs.chats?.();
  unsubs.chats=onSnapshot(query(collection(db,"chats"),where("members","array-contains",uid)),async snap=>{
    chatList=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));
    for(const c of chatList) await profile(c.members.find(m=>m!==uid));
    renderChats();
  },fail("Sohbetler"));
}
function renderChats(){
  const box=$("chats"); box.innerHTML="";
  if(!chatList.length){ box.innerHTML='<div style="padding:20px;color:var(--mut);text-align:center">Henüz sohbet yok.</div>'; return; }
  chatList.forEach(c=>{
    const o=c.members.find(m=>m!==uid), p=users[o]||{name:"Bilinmeyen"};
    const d=document.createElement("div");
    d.className="chat"+(cur===c.id?" on":"");
    d.innerHTML=`<div class="av" style="background:${colorOf(o)}">${esc((p.name||"?")[0].toUpperCase())}</div>
      <div style="flex:1;min-width:0"><div class="ell" style="font-weight:600">${esc(p.name)}</div>
      <div class="ell" style="font-size:12px;color:var(--mut)">${esc(c.last||"")}</div></div>`;
    d.onclick=()=>openChat(o);
    box.appendChild(d);
  });
}
$("bAdd").onclick=async()=>{
  const o=$("addId").value.trim();
  if(!o) return;
  if(o===uid) return toast("Kendinize sohbet açamazsınız");
  try{
    const s=await getDoc(doc(db,"users",o));
    if(!s.exists()) return toast("Kullanıcı bulunamadı");
    users[o]=s.data();
    const id=[uid,o].sort().join("_");
    await setDoc(doc(db,"chats",id),{members:[uid,o],updatedAt:serverTimestamp()},{merge:true});
    $("addId").value=""; openChat(o);
  }catch(err){ fail("Ekleme")(err); }
};
$("addId").onkeydown=e=>{if(e.key==="Enter") $("bAdd").click();};

// ---------- Sohbet aç / kapat ----------
function openChat(o){
  closeChat(true);
  cur=[uid,o].sort().join("_"); otherId=o;
  const p=users[o]||{name:"Bilinmeyen"};
  $("pName").textContent=p.name;
  $("pAv").textContent=(p.name||"?")[0].toUpperCase(); $("pAv").style.background=colorOf(o);
  $("empty").classList.add("hide"); $("chatView").classList.remove("hide"); $("app").classList.add("open");
  $("msgs").innerHTML=""; shown.clear();
  const c=cur;
  unsubs.msgs=onSnapshot(query(collection(db,"chats",c,"msgs"),orderBy("createdAt","asc")),renderMsgs,fail("Mesajlar"));
  unsubs.music=onSnapshot(doc(db,"chats",c,"state","music"),s=>{mState=s.data()||null;paintMusic();},fail("Müzik"));
  unsubs.chat=onSnapshot(doc(db,"chats",c),s=>{typ=s.data()?.typing||{};});
  watchCalls(c);
  renderChats();
}
function closeChat(silent){
  unsubs.msgs?.(); unsubs.music?.(); unsubs.chat?.(); unsubs.calls?.();
  cur=null; otherId=null; mState=null; typ={};
  au.pause(); au.removeAttribute("src"); au.dataset.u="";
  closeViewer();
  if(!silent){
    $("app").classList.remove("open"); $("chatView").classList.add("hide");
    $("empty").classList.remove("hide"); renderChats();
  }
}
$("bBack").onclick=()=>closeChat(false);

// ---------- Mesajlar ----------
function renderMsgs(snap){
  const box=$("msgs");
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<150;
  let mine=false;
  snap.docChanges().forEach(c=>{
    if(c.type!=="added"||shown.has(c.doc.id)) return;
    shown.add(c.doc.id);
    const m=c.doc.data(), isMine=m.from===uid;
    if(isMine) mine=true;
    let body;
    if(m.type==="text") body=esc(m.text).replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    else if(m.type==="image") body=`<img src="${esc(m.url)}" loading="lazy">`;
    else if(m.type==="video") body=`<video src="${esc(m.url)}" controls preload="metadata"></video>`;
    else if(m.type==="audio") body=`<audio src="${esc(m.url)}" controls></audio>`;
    else body=`<a href="${esc(m.url)}" target="_blank" download="${esc(m.name)}">📎 ${esc(m.name)}</a>`;
    const t=m.createdAt?.toDate?.()?.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})||"";
    const w=document.createElement("div");
    w.className="m"+(isMine?" me":"");
    w.innerHTML=`<div class="bub">${body}</div><div class="tm">${t}</div>`;
    box.appendChild(w);
  });
  if(near||mine) box.scrollTop=box.scrollHeight;
}
// chat/other parametreleri: gönderim sırasında sohbet değişse bile doğru sohbete yazılır
async function send(data,chat=cur,other=otherId){
  if(!chat) return;
  await addDoc(collection(db,"chats",chat,"msgs"),{from:uid,createdAt:serverTimestamp(),...data});
  await setDoc(doc(db,"chats",chat),{members:[uid,other],updatedAt:serverTimestamp(),
    last:data.type==="text"?data.text.slice(0,40):"📎 "+data.type},{merge:true});
}
const sendText=async()=>{
  const t=$("txt").value.trim(); if(!t||!cur) return;
  $("txt").value="";
  try{ await send({type:"text",text:t.slice(0,2000)}); }catch(err){ fail("Gönderilemedi")(err); }
};
$("bSend").onclick=sendText;
$("txt").onkeydown=e=>{if(e.key==="Enter") sendText();};
$("txt").oninput=()=>{
  if(!cur||Date.now()-typingAt<2500) return;
  typingAt=Date.now();
  setDoc(doc(db,"chats",cur),{typing:{[uid]:Date.now()}},{merge:true}).catch(()=>{});
};
setInterval(()=>{
  if(!cur) return;
  const on=Date.now()-(typ[otherId]||0)<4000;
  $("typing").textContent=on?`${users[otherId]?.name||""} yazıyor…`:"";
},800);

async function upload(blob,name,chat=cur){
  const r=ref(storage,`uploads/${chat}/${Date.now()}_${String(name).replace(/[^\w.\-]/g,"_")}`);
  await uploadBytes(r,blob);
  return getDownloadURL(r);
}
$("file").onchange=async e=>{
  const f=e.target.files[0]; e.target.value="";
  if(!f||!cur) return;
  if(f.size>100*1024*1024) return toast("En fazla 100 MB");
  const chat=cur, other=otherId;
  const type=f.type.startsWith("image/")?"image":f.type.startsWith("video/")?"video":f.type.startsWith("audio/")?"audio":"file";
  toast("Yükleniyor…");
  try{
    const blob=type==="image"?await shrink(f):f;
    const name=type==="image"?"foto.jpg":f.name;
    await send({type,url:await upload(blob,name,chat),name},chat,other);
  }catch(err){ fail("Yükleme")(err); }
};

// Sesli mesaj
let rec=null, chunks=[];
$("bRec").onclick=async()=>{
  if(rec?.state==="recording"){ rec.stop(); return; }
  if(!cur) return toast("Önce bir sohbet seçin");
  const chat=cur, other=otherId;
  const s=await navigator.mediaDevices?.getUserMedia({audio:true}).catch(()=>null);
  if(!s) return toast("Mikrofon izni gerekli");
  chunks=[]; rec=new MediaRecorder(s);
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop=async()=>{
    s.getTracks().forEach(t=>t.stop());
    $("bRec").style.color="";
    const b=new Blob(chunks,{type:rec.mimeType||"audio/webm"});
    try{ await send({type:"audio",url:await upload(b,"ses.webm",chat),name:"ses"},chat,other); }
    catch(err){ fail("Ses gönderilemedi")(err); }
  };
  rec.start(); $("bRec").style.color="#f43f5e";
};

// ---------- Birlikte müzik ----------
// chats/{id}/state/music -> {url,name,playing,pos,at}
function setMusic(p){ return setDoc(doc(db,"chats",cur,"state","music"),{...p,at:Date.now()},{merge:true}); }
function paintMusic(){
  if(!cur) return;
  const d=mState;
  if(!d?.url){
    $("pTitle").textContent="Parça yok"; $("pPlay").textContent="▶";
    au.pause(); au.removeAttribute("src"); au.dataset.u=""; return;
  }
  $("pTitle").textContent=d.name||"Parça";
  $("pPlay").textContent=d.playing?"⏸":"▶";
  if(au.dataset.u!==d.url){
    au.dataset.u=d.url; au.src=d.url;
    au.onloadedmetadata=seekTo;
  }
  seekTo();
  if(d.playing&&au.paused) au.play().catch(()=>toast("Oynatmak için ▶ düğmesine dokunun"));
  if(!d.playing&&!au.paused) au.pause();
}
function seekTo(){
  if(!mState) return;
  const target=mState.playing?mState.pos+(Date.now()-mState.at)/1000:mState.pos;
  if(Math.abs(au.currentTime-target)>1){ try{au.currentTime=target;}catch{} }
}
setInterval(()=>{ if(mState?.playing&&!au.paused) seekTo(); },2000);
$("bMusic").onclick=()=>{ if(cur) $("player").classList.toggle("hide"); };
$("pPlay").onclick=()=>{
  if(!mState?.url) return toast("Önce bir parça ekleyin");
  setMusic({playing:!mState.playing,pos:au.currentTime||mState.pos}).catch(fail("Müzik"));
};
$("pFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value="";
  if(!f||!cur) return;
  const chat=cur;
  toast("Müzik yükleniyor…");
  try{
    const url=await upload(f,f.name,chat);
    await setDoc(doc(db,"chats",chat,"state","music"),{url,name:f.name,playing:false,pos:0,at:Date.now()});
    toast("Parça eklendi ✓");
  }catch(err){ fail("Müzik")(err); }
};

// ---------- Ekran paylaşımı (WebRTC, sinyal Firestore) ----------
function addIce(s,c){ if(s.pc.remoteDescription) s.pc.addIceCandidate(c).catch(()=>{}); else s.pend.push(c); }
function flush(s){ s.pend.splice(0).forEach(c=>s.pc.addIceCandidate(c).catch(()=>{})); }

$("bShare").onclick=async()=>{
  if(!cur) return toast("Önce bir sohbet seçin");
  if(share) return stopShare();
  let stream;
  try{ stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false}); }
  catch{ return; }
  const chat=cur, sid=newId();
  const callRef=doc(db,"chats",chat,"calls","current");
  const iceCol=collection(db,"chats",chat,"calls","current","ice");
  const pc=new RTCPeerConnection(RTC);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  const s={pc,stream,sid,chat,pend:[],unsubs:[]};
  share=s;
  pc.onicecandidate=e=>{ if(e.candidate) addDoc(iceCol,{sid,from:uid,c:e.candidate.toJSON()}).catch(()=>{}); };
  stream.getVideoTracks()[0].onended=stopShare;
  try{
    const offer=await pc.createOffer(); await pc.setLocalDescription(offer);
    await setDoc(callRef,{sid,from:uid,offer:{type:offer.type,sdp:offer.sdp},answer:null,at:Date.now()});
  }catch(err){ stopShare(); return fail("Paylaşım")(err); }
  s.unsubs.push(onSnapshot(callRef,snap=>{
    const d=snap.data();
    if(d?.sid===sid&&d.answer&&!pc.currentRemoteDescription){
      pc.setRemoteDescription(d.answer).then(()=>flush(s)).catch(()=>{});
    }
  }));
  s.unsubs.push(onSnapshot(iceCol,snap=>snap.docChanges().forEach(c=>{
    const d=c.doc.data();
    if(c.type==="added"&&d.sid===sid&&d.from!==uid) addIce(s,d.c);
  })));
  toast("Ekran paylaşılıyor. Arkadaşınız otomatik izleyebilir.");
};
function stopShare(){
  if(!share) return;
  const s=share; share=null;
  s.stream.getTracks().forEach(t=>t.stop());
  s.pc.close(); s.unsubs.forEach(u=>u());
  deleteDoc(doc(db,"chats",s.chat,"calls","current")).catch(()=>{});
  toast("Paylaşım durduruldu");
}
$("scClose").onclick=()=>closeViewer();

function watchCalls(chat){
  unsubs.calls?.();
  unsubs.calls=onSnapshot(doc(db,"chats",chat,"calls","current"),async snap=>{
    const d=snap.data();
    if(!d||!d.offer){ closeViewer(); return; }
    if(d.from===uid) return;                  // kendi paylaşımımız
    if(viewer?.sid===d.sid) return;           // zaten izliyoruz
    if(Date.now()-d.at>12*3600e3) return;     // bayat oturum
    closeViewer();
    const sid=d.sid, pc=new RTCPeerConnection(RTC);
    const v={pc,sid,pend:[],unsubs:[]}; viewer=v;
    const name=(await profile(d.from)).name;
    pc.ontrack=e=>{
      $("scVid").srcObject=e.streams[0];
      $("scTxt").textContent=`${name} ekranı`;
      $("screen").classList.remove("hide");
    };
    const iceCol=collection(db,"chats",chat,"calls","current","ice");
    pc.onicecandidate=e=>{ if(e.candidate) addDoc(iceCol,{sid,from:uid,c:e.candidate.toJSON()}).catch(()=>{}); };
    v.unsubs.push(onSnapshot(iceCol,s2=>s2.docChanges().forEach(c=>{
      const x=c.doc.data();
      if(c.type==="added"&&x.sid===sid&&x.from!==uid&&viewer===v) addIce(v,x.c);
    })));
    try{
      await pc.setRemoteDescription(d.offer);
      flush(v);
      const ans=await pc.createAnswer(); await pc.setLocalDescription(ans);
      await updateDoc(doc(db,"chats",chat,"calls","current"),{answer:{type:ans.type,sdp:ans.sdp}});
    }catch(err){ console.error(err); }
  },fail("Paylaşım dinleme"));
}
function closeViewer(){
  if(!viewer) return;
  const v=viewer; viewer=null;
  v.pc.close(); v.unsubs.forEach(u=>u());
  $("scVid").srcObject=null; $("screen").classList.add("hide");
}

// ---------- Tema ----------
const SWATCH=["#0095f6","#8e5cf5","#10b981","#f43f5e","#f59e0b","#ec4899"];
const prefs=()=>JSON.parse(localStorage.getItem("kisir_theme")||"{}");
function applyTheme(){
  const p=prefs();
  document.documentElement.style.setProperty("--acc",p.acc||"#0095f6");
  document.body.classList.toggle("light",!!p.light);
}
function savePrefs(x){ localStorage.setItem("kisir_theme",JSON.stringify({...prefs(),...x})); applyTheme(); }
SWATCH.forEach(col=>{
  const b=document.createElement("button");
  b.className="sw"; b.style.background=col;
  b.onclick=()=>savePrefs({acc:col});
  $("swatches").appendChild(b);
});
$("bSet").onclick=()=>{ $("lightT").checked=!!prefs().light; $("setModal").classList.remove("hide"); };
$("setX").onclick=()=>$("setModal").classList.add("hide");
$("setModal").onclick=e=>{ if(e.target.id==="setModal") $("setModal").classList.add("hide"); };
$("lightT").onchange=e=>savePrefs({light:e.target.checked});
applyTheme();
</script>
